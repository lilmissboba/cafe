.radio .rdot{width:10px;height:10px;border-radius:50%;background:#D9C3A8;flex:none}.radio.playing .rdot{background:#E8635E;box-shadow:0 0 0 3px #FBD3D1;animation:onair 1.6s ease-in-out infinite}

main{padding-bottom:110px}
#ver{text-align:center;color:#8C6E55;font:500 12px Fredoka,sans-serif;padding:0 0 120px;opacity:.7}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;transition:.3s;background:var(--wood2);color:var(--cream);padding:10px 18px;border-radius:999px;font-weight:500;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%)}
.demo{background:#FFE3A1;color:#5A3826;border-radius:12px;padding:8px 12px;margin-top:14px;font-size:14px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script type="module">
/* ============ SETTINGS ============ */
const SUPABASE_URL = "https://gednciiobqwcocobsgim.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlZG5jaWlvYnF3Y29jb2JzZ2ltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2MTk3NDUsImV4cCI6MjEwOTE5NTc0NX0.Nh5kkIWbKkjwVxSuCVJzMVuGn-M6IQPbZMqUNp3pf6s";     // the "anon public" key (safe to put on a website)
const MAX_TASKS = 40;
const TWITCH_URL = "https://www.twitch.tv/lilmissboba";
const YT_PLAYLIST = "PLAT_XughQA_w";      // your youtube playlist (the part after list= in the link)
const CAFE_TIMEZONE = "Asia/Singapore";   // check-ins reset at midnight here (same as the cafe)
const CARD_SIZE = 10;                      // stamps per boba passport
/* ================================= */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DEMO = new URLSearchParams(location.search).has("demo") || !SUPABASE_URL;
let sb, me = null, mine = null, editing = -1;

function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2200); }

/* ---------- a pretend database for trying the page (demo mode) ---------- */
function demoClient() {
  const rows = {
    lilmissboba: { login: "lilmissboba", twitch_id: "1", display: "lilmissboba", tasks: [{ text: "stream setup", done: true }, { text: "edit vod", done: false }, { text: "walk ashe", done: false }], current: 1, pearls_today: 1 },
    kyayu_: { login: "kyayu_", twitch_id: "2", display: "kyayu_", tasks: [{ text: "study for exam", done: false }, { text: "laundry", done: false, urgent: true }, { text: "dinner", done: true }, { text: "stretch", done: false, daily: true }], current: 0, pearls_today: 3 },
    pearlpanda: { login: "pearlpanda", twitch_id: "3", display: "pearlpanda", tasks: [{ text: "read 20 pages", done: false }, { text: "email boss", done: true }], current: 0, pearls_today: 5 },
  };
  rows.kyayu_.checkin = { total: 14, stamps: 4, cards: 1, streak: 3, last: "2000-01-01", display: "kyayu_" };
  rows.pearlpanda.gb_msg = "love this cafe so much ♡"; rows.pearlpanda.gb_signed_at = new Date(Date.now() - 86400000).toISOString();
  rows.lilmissboba.gb_msg = ""; rows.lilmissboba.gb_signed_at = new Date(Date.now() - 2 * 86400000).toISOString();
  rows.__cafe__ = { login: "__cafe__", tasks: [], current: -1 };
  rows.lilmissboba.in_cafe = true; rows.lilmissboba.status = "working"; rows.pearlpanda.in_cafe = true; rows.pearlpanda.status = "working";
  rows.mochimallow = { login: "mochimallow", twitch_id: "4", display: "mochimallow", tasks: [], current: -1, pearls_today: 0, in_cafe: true, status: "lurking" };
  for (const r of Object.values(rows)) r.updated_at = new Date().toISOString();
  let session = null;
  const q = () => { const st = { f: [] }; const api = {
    select() { return api; }, eq(k, v) { st.f.push([k, v]); return api; }, not(k) { st.f.push([k, "__notnull"]); return api; }, order() { return api; }, limit(n) { st.limit = n; return api; },
    update(vals) { st.upd = vals; return api; },
    then(res, rej) {
      let list = Object.values(rows).filter(r => st.f.every(([k, v]) => v === "__notnull" ? r[k] != null : String(r[k]) === String(v)));
      if (st.upd) { list.forEach(r => Object.assign(r, JSON.parse(JSON.stringify(st.upd)))); }
      list = list.map(r => JSON.parse(JSON.stringify(r)));
      if (st.single) return Promise.resolve({ data: list[0] || null, error: null }).then(res, rej);
      return Promise.resolve({ data: st.limit ? list.slice(0, st.limit) : list, error: null }).then(res, rej);
    },
    maybeSingle() { st.single = true; return api; },
  }; return api; };
  return {
    auth: {
      getSession: async () => ({ data: { session } }),
      onAuthStateChange: () => ({}),
      signInWithOAuth: async () => { session = { user: { user_metadata: { provider_id: "2", name: "kyayu_", nickname: "kyayu_" } } }; boot(); },
      signOut: async () => { session = null; boot(); },
    },
    from: () => q(),
  };
}

/* ---------- loading and saving your ticket ---------- */
async function loadMine() {
  const { data } = await sb.from("cafe_lists").select("*").eq("twitch_id", me.id).maybeSingle();
  return data;
}
async function mutateRow(patchFor, okMsg) {   // read the latest, change it, save it (retries if the cafe changed it at the same moment)
  for (let tries = 0; tries < 3; tries++) {
    const row = await loadMine(); if (!row) return;
    const patch = patchFor(JSON.parse(JSON.stringify(row)));
    if (!patch) return;
    const { data, error } = await sb.from("cafe_lists").update(Object.assign(patch, { updated_by: "web", updated_at: new Date().toISOString() }))
      .eq("login", row.login).eq("updated_at", row.updated_at).select();
    if (!error && data && data.length) { mine = data[0]; editing = -1; render(); renderGuestbook(); if (okMsg) toast(typeof okMsg === "function" ? okMsg() : okMsg); return; }
  }
  toast("couldn't save, try again in a moment");
}
function mutate(change, okMsg) {
  return mutateRow(row => { const tasks = row.tasks || [], st = { current: row.current == null ? -1 : row.current }; if (change(tasks, st) === false) return null; return { tasks, current: st.current }; }, okMsg);
}
/* ---------- daily check-in (boba passport) and the guestbook ---------- */
function cafeDay(d = new Date()) { const p = {}; new Intl.DateTimeFormat("en-GB", { timeZone: CAFE_TIMEZONE, year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(d).forEach(x => p[x.type] = x.value); return `${p.year}-${p.month}-${p.day}`; }
let lastCheckin = null;
function checkIn() {
  mutateRow(row => {
    const today = cafeDay(), ci = row.checkin || { total: 0, stamps: 0, cards: 0, streak: 0, last: "" };
    if (ci.last === today) { toast("already checked in today ✓"); return null; }
    const y = new Date(today + "T00:00:00Z"); y.setUTCDate(y.getUTCDate() - 1);
    ci.streak = ci.last === y.toISOString().slice(0, 10) ? (ci.streak || 0) + 1 : 1;
    ci.last = today; ci.total = (ci.total || 0) + 1; ci.stamps = (ci.stamps || 0) + 1; ci.display = row.display || row.login;
    ci.justFilled = false;
    if (ci.stamps >= CARD_SIZE) { ci.cards = (ci.cards || 0) + 1; ci.stamps = 0; ci.justFilled = true; }
    ci.web = true; lastCheckin = ci;
    return { checkin: ci };
  }, () => lastCheckin && lastCheckin.justFilled ? `passport #${lastCheckin.cards} filled! 🎉` : "checked in! 🧋");
}
function signGuestbook(note) {
  mutateRow(row => ({ gb_msg: note.trim().slice(0, 200), gb_signed_at: new Date().toISOString() }), mine && mine.gb_signed_at ? "your note is updated ♡" : "thanks for signing the guestbook ♡");
}
const cup = i => { const c = [["#E8C9A6", "#C99A6B"], ["#D9C2F0", "#A98BD8"], ["#CDEBC0", "#8DBF7A"], ["#F9C6D6", "#E890AB"], ["#FFE3A1", "#E8B860"]][i % 5];
  return `<svg viewBox="0 0 50 54" width="40" height="44"><path d="M31 2l-4 14" stroke="${c[1]}" stroke-width="3.4" stroke-linecap="round"/><path d="M10 15q15-9 30 0v3H10z" fill="#fff" stroke="${c[1]}" stroke-width="1.6"/><path d="M11 18h28l-3.4 30q-.4 3-3.4 3H17.8q-3 0-3.4-3z" fill="${c[0]}" stroke="${c[1]}" stroke-width="1.6"/><g fill="#5A3826"><circle cx="18" cy="44" r="2.3"/><circle cx="24" cy="46" r="2.3"/><circle cx="30" cy="44" r="2.3"/><circle cx="21" cy="40" r="2.3"/><circle cx="28" cy="40" r="2.3"/></g><circle cx="20" cy="28" r="1.6" fill="#5A3826"/><circle cx="30" cy="28" r="1.6" fill="#5A3826"/><path d="M23 31q2 2 4 0" stroke="#5A3826" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>`; };
function passportHTML() {
  const ci = mine.checkin || { stamps: 0, cards: 0, total: 0, streak: 0, last: "" }, done = ci.last === cafeDay();
  const slots = Array.from({ length: CARD_SIZE }, (_, i) => `<div class="slot ${i < ci.stamps ? "on" : ""}">${i < ci.stamps ? cup(i) : ""}</div>`).join("");
  const left = CARD_SIZE - (ci.stamps || 0);
  return `<div class="card passport"><div class="pin">
      <div class="ph"><span class="av">${esc((mine.display || mine.login).charAt(0).toUpperCase())}</span><span class="pnm">${esc(mine.display || mine.login)}</span><span class="lb">boba passport</span></div>
      <div class="grid">${slots}</div>
      <div class="pf">passport #${(ci.cards || 0) + 1} · <b>${left}</b> more ${left === 1 ? "stamp" : "stamps"} to fill it${ci.cards ? ` · ${ci.cards} filled 🎫` : ""}${ci.streak > 1 && done ? ` · ${ci.streak}-day streak 🔥` : ""}</div>
      <div class="center">${done ? `<button class="big" disabled>checked in today ✓</button>` : `<button class="big" id="checkin">check in today 🧋</button>`}</div>
      <p class="hint center">one stamp a day, here or with !checkin on stream (they share the same passport)</p>
    </div></div>`;
}
async function renderGuestbook() {
  const { data } = await sb.from("cafe_lists").select("login,display,gb_msg,gb_signed_at").not("gb_signed_at", "is", null).order("gb_signed_at", { ascending: false }).limit(60);
  const list = (data || []).filter(r => r.gb_signed_at).sort((a, b) => b.gb_signed_at.localeCompare(a.gb_signed_at));
  const signed = mine && mine.gb_signed_at;
  $("guestbook").innerHTML = `<div class="gbcard"><div class="gbtitle">🌸 miss boba's guestbook 🌸</div>
    ${me && mine ? `<form class="gbsign" id="gbForm"><input id="gbNote" maxlength="200" placeholder="leave a note for miss boba (optional)" value="${signed ? esc(mine.gb_msg || "") : ""}"><button class="big">${signed ? "update my note" : "sign"}</button></form>` : ""}
    <div class="gblist">${list.length ? list.map(r => `<div class="gbe"><span>🌸</span><div><b>${esc(r.display || r.login)}</b>${r.gb_msg ? `<small>"${esc(r.gb_msg)}"</small>` : ""}</div></div>`).join("") : `<div class="empty">no signatures yet. be the first ♡</div>`}</div>
    <p class="hint center">${list.length} ${list.length === 1 ? "signature" : "signatures"} · you can also sign on stream with !sign</p></div>`;
  const f = $("gbForm"); if (f) f.onsubmit = e => { e.preventDefault(); signGuestbook($("gbNote").value); };
}

/* ---------- what you can do ---------- */
function addTasks(text) {
  const items = text.split(";").map(x => x.trim()).filter(Boolean).map(x => x.slice(0, 200));
  if (!items.length) return;
  mutate(t => { if (t.length + items.length > MAX_TASKS) { toast(`your list is full (${MAX_TASKS} max)`); return false; } items.forEach(x => t.push({ text: x, done: false, addedAt: Date.now() })); },
    items.length > 1 ? `added ${items.length} tasks!` : "task added!");
}
function toggleDone(i) {
  mutate((t, st) => {
    const x = t[i]; if (!x) return false;
    if (!x.done) { x.done = true; x.doneAt = Date.now(); x.webDone = true; if (st.current === i) st.current = -1; }
    else { x.done = false; delete x.doneAt; delete x.webDone; }
  }, mine && mine.tasks[i] && !mine.tasks[i].done ? "done! ✓ +1 pearl" : "put back on your list");
}
function focusTask(i) { mutate((t, st) => { if (!t[i] || t[i].done) return false; st.current = st.current === i ? -1 : i; }, mine && mine.current === i ? "stopped focusing" : "focusing ♡"); }
function urgentTask(i) { const was = mine && mine.tasks[i] && mine.tasks[i].urgent; mutate(t => { if (!t[i] || t[i].done) return false; t[i].urgent = !t[i].urgent; }, was ? "not urgent anymore" : "marked urgent ❗"); }
function clearDone() {   // like !cleardone on stream: removes finished tasks, keeps your focus on the right task
  mutate((t, st) => {
    const keep = t.map((x, i) => ({ x, i })).filter(e => !e.x.done);
    if (keep.length === t.length) { toast("nothing to clear yet"); return false; }
    const focus = keep.findIndex(e => e.i === st.current);
    t.splice(0, t.length, ...keep.map(e => e.x)); st.current = focus;
  }, "cleared your finished tasks ✨");
}
function delTask(i) { mutate((t, st) => { if (!t[i]) return false; t.splice(i, 1); if (st.current === i) st.current = -1; else if (st.current > i) st.current--; }, "crossed that off"); }
function editTask(i, text) { text = text.trim().slice(0, 200); if (!text) { editing = -1; render(); return; } mutate(t => { if (!t[i]) return false; t[i].text = text; }, "saved"); }

/* ---------- drawing the page ---------- */
function render() {
  const app = $("app");
  if (!me) {
    app.innerHTML = `<div class="note"><h2>welcome in ♡</h2><p>log in with your twitch account to see and update your task ticket, even when the stream is offline.</p>
      <button class="big twitch" id="login">log in with twitch</button></div>`;
    $("login").onclick = () => sb.auth.signInWithOAuth({ provider: "twitch", options: { redirectTo: location.origin + location.pathname } });
    return;
  }
  if (!mine) {
    app.innerHTML = `<div class="note"><h2>we can't find your ticket yet</h2><p>say hi in <b>lilmissboba</b>'s twitch chat during a stream so the cafe makes your ticket, then come back here!</p>
      <button class="big" id="out">log out</button></div>`;
    $("out").onclick = () => sb.auth.signOut();
    return;
  }
  const t = mine.tasks || [], cur = mine.current == null ? -1 : mine.current;
  const rows = t.map((x, i) => editing === i
    ? `<li><span class="no">${i + 1}</span><input class="edit" id="editBox" value="${esc(x.text)}" maxlength="200"><button class="btn" data-a="save" data-i="${i}">save</button></li>`
    : `<li class="${x.done ? "done" : ""} ${cur === i ? "focus" : ""} ${x.urgent && !x.done ? "urgent" : ""}"><span class="no">${i + 1}</span>
        <button class="chk" data-a="done" data-i="${i}" aria-label="${x.done ? "mark not done" : "mark done"}">${x.done ? "✓" : ""}</button>
        <span class="tx" data-a="edit" data-i="${i}" title="click to edit">${esc(x.text)}</span>
        ${x.daily ? `<span class="tag daily">daily</span>` : ""}${cur === i ? `<span class="tag">focusing</span>` : ""}
        ${x.done ? "" : `<button class="btn u ${x.urgent ? "on" : ""}" data-a="urgent" data-i="${i}" title="${x.urgent ? "not urgent" : "mark urgent"}" aria-label="${x.urgent ? "not urgent" : "mark urgent"}">❗</button><button class="btn f" data-a="focus" data-i="${i}">${cur === i ? "unfocus" : "focus"}</button>`}
        <button class="btn x" data-a="del" data-i="${i}" aria-label="delete">×</button></li>`).join("");
  app.innerHTML = `<div class="card ticket"><span class="clip"></span><div class="paper">
      <div class="head"><span class="nm">${esc(mine.display || mine.login)}</span><span class="pill">✓ ${mine.pearls_today || 0} today</span>
        ${(() => { const left = t.filter(x => !x.done).length; return t.length ? `<span class="pill pink">${left ? `${left} ${left === 1 ? "task" : "tasks"} remaining` : "all done ✨"}</span>` : ""; })()}<button class="out" id="out">log out</button></div>
      <ol>${rows || `<div class="empty">your list is empty. add your first task below ♡</div>`}</ol>
      ${t.some(x => x.done) ? `<div class="cleardone"><button class="soft" id="clearDone">✨ clear done (${t.filter(x => x.done).length})</button></div>` : ""}
      <form class="add" id="addForm"><input id="newTask" placeholder="add a task (use ; for several)" maxlength="400" autocomplete="off"><button class="big">add</button></form>
      <p class="hint">tap a task to rename it · ❗ marks it urgent · tap the circle when it's done · your ticket in the cafe updates within a few seconds</p>
    </div></div>`;
  app.insertAdjacentHTML("beforeend", passportHTML());
  const ck = $("checkin"); if (ck) ck.onclick = () => checkIn();
  $("out").onclick = () => sb.auth.signOut();
  const cd = $("clearDone"); if (cd) cd.onclick = () => clearDone();
  $("addForm").onsubmit = e => { e.preventDefault(); const v = $("newTask").value; $("newTask").value = ""; addTasks(v); };
  app.querySelectorAll("[data-a]").forEach(el => el.onclick = () => {
    const i = +el.dataset.i, a = el.dataset.a;
    if (a === "done") toggleDone(i); else if (a === "urgent") urgentTask(i); else if (a === "focus") focusTask(i); else if (a === "del") delTask(i);
    else if (a === "edit") { editing = i; render(); const b = $("editBox"); b.focus(); b.select(); b.onkeydown = ev => { if (ev.key === "Enter") editTask(i, b.value); if (ev.key === "Escape") { editing = -1; render(); } }; }
    else if (a === "save") editTask(i, $("editBox").value);
  });
}
async function renderOthers() {   // when the stream's on: everyone in the cafe right now. otherwise: recent tickets
  const { data: beat } = await sb.from("cafe_lists").select("updated_at").eq("login", "__cafe__").maybeSingle();
  const open = beat && Date.now() - Date.parse(beat.updated_at) < 3 * 60000;
  $("twbar").classList.toggle("live", !!open);
  $("twtxt").textContent = open ? "the cafe is open right now! come co-work with us on twitch ♡" : "miss boba's cafe is also on twitch ♡ come co-work with us";
  document.querySelector("#twbar .twbtn").textContent = open ? "join on twitch" : "visit on twitch";
  let q = sb.from("cafe_lists").select("login,display,tasks,current,pearls_today,updated_at,in_cafe,status");
  q = open ? q.eq("in_cafe", true).limit(80) : q.order("updated_at", { ascending: false }).limit(120);
  const { data } = await q;
  let list = (data || []).filter(r => r.login !== "__cafe__" && (!mine || r.login !== mine.login));
  if (!open) list = list.filter(r => (r.tasks || []).some(t => !t.done)).slice(0, 24);
  else list.sort((a, b) => (a.status === "lurking") - (b.status === "lurking") || (a.display || a.login).localeCompare(b.display || b.login));
  $("othersTitle").hidden = !list.length;
  $("othersTitle").textContent = open ? `in the cafe right now · ${list.length}` : "recent tickets";
  $("others").innerHTML = list.map(r => { const t = r.tasks || [], cur = r.current == null ? -1 : r.current;
    const body = r.status === "lurking" ? `<li>☕ cozy lurking by the window</li>` : t.length ? t.slice(0, 6).map((x, i) => `<li class="${x.done ? "done" : ""} ${cur === i ? "focus" : ""} ${x.urgent && !x.done ? "urgent" : ""}">${i + 1}. ${x.urgent && !x.done ? "❗" : ""}${esc(x.text)}${cur === i ? " ★" : ""}</li>`).join("") + (t.length > 6 ? `<li>+${t.length - 6} more</li>` : "") : `<li>sipping boba 🧋</li>`;
    return `<div class="ticket mini"><span class="clip"></span><div class="paper"><div class="nm">${esc(r.display || r.login)} <span class="pill">✓ ${r.pearls_today || 0}</span></div><ul>${body}</ul></div></div>`; }).join("");
}

let booting = false;
async function boot() {
  if (booting) return; booting = true;
  try { await bootInner(); }
  catch (e) { console.error(e); $("app").innerHTML = `<div class="note"><h2>oops, the cafe didn't load</h2><p>please refresh the page. if it keeps happening, tell miss boba!</p><button class="big" onclick="location.reload()">refresh</button></div>`; }
  finally { booting = false; }
}
async function bootInner() {
  const { data } = await sb.auth.getSession();
  const s = data && data.session;
  me = s ? { id: String(s.user.user_metadata.provider_id || s.user.user_metadata.sub || ""), name: s.user.user_metadata.nickname || s.user.user_metadata.name || "" } : null;
  mine = me ? await loadMine() : null;
  render(); renderOthers().catch(console.error); renderGuestbook().catch(console.error);
}

$("twbar").href = TWITCH_URL;
/* ---------- cafe radio ---------- */
(() => {
  const r = $("radio"), btn = $("radioBtn");
  if (!YT_PLAYLIST) { r.remove(); return; }
  btn.onclick = () => {
    if (!$("radioFrame").firstChild)   // the player only loads the first time you open it, so the page stays quick
      $("radioFrame").innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/videoseries?list=${encodeURIComponent(YT_PLAYLIST)}&loop=1&playsinline=1" title="cafe radio" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
    const open = r.classList.toggle("collapsed") === false;
    btn.setAttribute("aria-expanded", open); r.classList.add("playing");
  };
})();

(async () => {
  if (DEMO) { sb = demoClient(); $("demoNote").innerHTML = `<div class="demo">demo mode: try it out with pretend data ♡ (nothing is saved)</div>`; }
  else { const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm"); sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY); sb.auth.onAuthStateChange(ev => { if (ev === "SIGNED_IN" || ev === "SIGNED_OUT") setTimeout(boot, 0); }); }
  await boot();
  setInterval(async () => { if (me && editing < 0 && document.activeElement !== $("newTask")) { mine = await loadMine(); render(); } renderOthers(); }, 10000);   // picks up changes made in the cafe
})();
</script>
